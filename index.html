<!doctype html>
<html lang="it" class="loop-countdown-enabled">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030405">
  <title>Outer Wilds — Sistema solare</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./solar.css">
</head>
<body>
  <main class="wallpaper" aria-label="Sistema solare animato di Outer Wilds">
    <canvas id="starfield" class="starfield" aria-hidden="true"></canvas>

    <header class="clock" aria-label="Ora corrente">
      <time id="time" class="clock__time">--:--</time>
    </header>
    <div class="loop-countdown" aria-label="Tempo rimanente all'esplosione">
      <span id="loop-remaining">22:00</span>
    </div>

    <div class="solar-system" aria-hidden="true">
      <canvas id="orbit-paths" class="orbit-paths"></canvas>
      <div class="sun-glow"></div>
      <div class="sun"><img class="sun__image" src="./assets/Sun.png" alt="" draggable="false"></div>
      <div class="stranger-wrap">
        <div class="stranger-motion">
          <div class="stranger-shadow"></div>
          <img class="stranger" src="./assets/Stranger.png" alt="" draggable="false">
        </div>
      </div>
      <div class="sun-station-orbit">
        <img class="sun-station" src="./assets/Sun_Station.png" alt="" draggable="false">
      </div>

      <div class="orbit orbit--twins">
        <div class="traveller traveller--twins">
          <div class="binary-system">
            <img class="sand-pillar" src="./assets/Sand_Pillar.png" alt="" draggable="false">
            <img class="planet planet--ember" src="./assets/Ember_Twin.png" alt="" draggable="false">
            <img class="planet planet--ember planet--twins-final" src="./assets/Ember_Twin_Full.png" alt="" draggable="false">
            <img class="planet planet--ash" src="./assets/Ash_Twin.png" alt="" draggable="false">
            <img class="planet planet--ash planet--twins-final" src="./assets/Ash_Twin_Empty.png" alt="" draggable="false">
          </div>
        </div>
      </div>

      <div class="orbit orbit--timber">
        <div class="traveller traveller--timber">
          <span class="moon-orbit"><img class="moon" src="./assets/Attlerock.png" alt="" draggable="false"></span>
          <img class="planet planet--timber" src="./assets/Timber_Hearth.png" alt="" draggable="false">
        </div>
      </div>

      <div class="orbit orbit--brittle">
        <div class="traveller traveller--brittle">
          <img class="planet planet--brittle" src="./assets/Brittle_Hollow.png" alt="" draggable="false">
          <span class="moon-orbit moon-orbit--brittle"><img class="moon moon--hollow-lantern" src="./assets/Hollows_Lantern.png" alt="" draggable="false"></span>
        </div>
      </div>
      <div id="meteorite-layer" class="meteorite-layer" aria-hidden="true"></div>

      <div class="orbit orbit--giants">
        <div class="traveller traveller--giants">
          <img class="planet planet--giants" src="./assets/Giant's_Deep.png" alt="" draggable="false">
          <span id="giants-lightning" class="giants-lightning" aria-hidden="true"></span>
          <span class="moon-orbit moon-orbit--giants">
            <img class="moon moon--orbital-probe-full" src="./assets/Probe_Cannon_Full.png" alt="" draggable="false">
            <img class="moon moon--orbital-probe" src="./assets/Probe_Cannon.png" alt="" draggable="false">
            <span class="probe-burst"></span>
          </span>
          <span id="quantum-orbit" class="quantum-orbit"><span class="quantum-hover-target"><img class="quantum-moon" src="./assets/Quantum_Moon.png" alt="" draggable="false"></span></span>
        </div>
      </div>

      <div class="orbit orbit--bramble">
        <div class="traveller traveller--bramble">
          <img class="planet planet--bramble" src="./assets/Dark_Bramble.png" alt="" draggable="false">
        </div>
      </div>

      <div class="orbit orbit--beacon">
        <div class="traveller traveller--beacon">
          <span class="outer-beacon" aria-label="Corpo luminoso esterno"></span>
        </div>
      </div>

      <div class="interloper-orbit"></div>
      <span id="interloper-beam" class="interloper-beam" aria-hidden="true"></span>
      <img id="interloper" class="interloper" src="./assets/interloper.png" alt="" draggable="false">
      <img class="white-hole" src="./assets/White_Hole.png" alt="" draggable="false">
    </div>
    <span class="probe-shot" aria-hidden="true"></span>
    <canvas id="explosion-particles" class="explosion-particles" aria-hidden="true"></canvas>
  </main>
  <script>
    const timeElement = document.getElementById('time');
    const system = document.querySelector('.solar-system');
    const sun = document.querySelector('.sun');
    const interloper = document.getElementById('interloper');
    const interloperOrbit = document.querySelector('.interloper-orbit');

    function updateClock() {
      const now = new Date();
      timeElement.textContent = new Intl.DateTimeFormat('it-IT', {
        hour: '2-digit', minute: '2-digit', hour12: false
      }).format(now);
      timeElement.dateTime = now.toISOString();
    }

    updateClock();
    setInterval(updateClock, 1000);

    const quantumOrbit = document.getElementById('quantum-orbit');
    const quantumHosts = [
      '.traveller--twins', '.traveller--timber', '.traveller--brittle',
      '.traveller--giants', '.traveller--bramble', null
    ].map(selector => document.querySelector(selector));
    let currentQuantumHost = Math.floor(Math.random() * quantumHosts.length);
    function placeQuantumMoon() {
      const host = quantumHosts[currentQuantumHost];
      quantumOrbit.classList.toggle('quantum-orbit--absent', !host);
      (host || system).append(quantumOrbit);
    }
    placeQuantumMoon();
    const quantumPeriod = parseFloat(getComputedStyle(quantumOrbit).getPropertyValue('--period'));
    quantumOrbit.style.animationDelay = `${-Math.random() * quantumPeriod}s`;
    let quantumTransitioning = false;
    let quantumShiftTimeout;
    let quantumTransitionId = 0;

    function selectNextQuantumHost() {
      // Pick any other destination, including the empty sixth location.
      const nextOffset = 1 + Math.floor(Math.random() * (quantumHosts.length - 1));
      currentQuantumHost = (currentQuantumHost + nextOffset) % quantumHosts.length;
      placeQuantumMoon();
    }

    function moveQuantumMoon() {
      if (quantumTransitioning) return;
      quantumTransitioning = true;
      const transitionId = ++quantumTransitionId;
      quantumOrbit.classList.add('quantum-orbit--shifting');
      quantumShiftTimeout = setTimeout(() => {
        quantumShiftTimeout = undefined;
        selectNextQuantumHost();
        requestAnimationFrame(() => requestAnimationFrame(() => {
          if (transitionId !== quantumTransitionId) return;
          quantumOrbit.classList.remove('quantum-orbit--shifting');
          quantumTransitioning = false;
          syncOrbitAnimations();
        }));
      }, 350 / previewScale);
    }

    function moveQuantumMoonBeforePause() {
      ++quantumTransitionId;
      clearTimeout(quantumShiftTimeout);
      quantumShiftTimeout = undefined;
      quantumTransitioning = false;
      quantumOrbit.classList.add('quantum-orbit--instant');
      selectNextQuantumHost();
      quantumOrbit.classList.remove('quantum-orbit--shifting');
      syncOrbitAnimations();
    }

    const quantumHoverTarget = document.querySelector('.quantum-hover-target');
    quantumHoverTarget.addEventListener('pointerenter', moveQuantumMoon);
    // Wallpaper Engine's embedded browser also reports mouseenter reliably
    // when an animated object moves underneath a stationary cursor.
    quantumHoverTarget.addEventListener('mouseenter', moveQuantumMoon);

    let orbitSpeed = 1;
    let previewScale = 1;
    let strangerSpeed = .5;
    let quantumAutoShiftEnabled = true;
    let quantumShiftSeconds = 30;
    let wallpaperPaused = false;
    let quantumShiftTimer;

    function updateQuantumShiftTimer() {
      clearInterval(quantumShiftTimer);
      quantumShiftTimer = quantumAutoShiftEnabled && !wallpaperPaused
        ? setInterval(moveQuantumMoon, quantumShiftSeconds * 1000 / previewScale)
        : undefined;
    }
    updateQuantumShiftTimer();
    window.addEventListener('wallpaper-quantum-auto-shift-changed', event => {
      quantumAutoShiftEnabled = event.detail;
      updateQuantumShiftTimer();
    });
    window.addEventListener('wallpaper-quantum-shift-seconds-changed', event => {
      quantumShiftSeconds = event.detail;
      updateQuantumShiftTimer();
    });
    window.addEventListener('wallpaper-pause-changed', event => {
      const wasPaused = wallpaperPaused;
      wallpaperPaused = event.detail;
      if (!wasPaused && wallpaperPaused) moveQuantumMoonBeforePause();
      if (wasPaused && !wallpaperPaused) {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          quantumOrbit.classList.remove('quantum-orbit--instant');
        }));
      }
      updateQuantumShiftTimer();
    });

    function syncOrbitAnimations() {
      document.querySelectorAll('.traveller, .binary-system, .moon-orbit, .quantum-orbit, .sun-station-orbit, .planet--timber, .planet--brittle, .planet--giants, .planet--bramble')
        .forEach(element => element.getAnimations().forEach(animation => {
          animation.playbackRate = orbitSpeed * previewScale;
        }));
    }

    const orbitAnimationNames = new Set(['orbit', 'binary-spin', 'moon-orbit', 'station-orbit', 'stranger-orbit', 'planet-spin']);
    function syncLoopEffectAnimations() {
      document.getAnimations().forEach(animation => {
        if (!orbitAnimationNames.has(animation.animationName) && animation.playbackRate !== previewScale) {
          animation.playbackRate = previewScale;
        }
      });
    }

    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const interloperBeam = document.getElementById('interloper-beam');
    const strangerOrbits = [[.62, .98], [.72, 1.08], [.84, 1.18]];
    function chooseStrangerOrbit() {
      const [radiusX, radiusY] = strangerOrbits[Math.floor(Math.random() * strangerOrbits.length)];
      const direction = Math.random() * Math.PI * 2;
      const impact = (Math.random() < .5 ? -1 : 1) * (.015 + Math.random() * .03);
      system.style.setProperty('--stranger-radius-x-factor', radiusX);
      system.style.setProperty('--stranger-radius-y-factor', radiusY);
      system.style.setProperty('--stranger-impact-factor', impact);
      system.style.setProperty('--stranger-cos', Math.cos(direction));
      system.style.setProperty('--stranger-sin', Math.sin(direction));
    }
    chooseStrangerOrbit();
    system.addEventListener('animationiteration', event => {
      if (event.animationName === 'stranger-orbit') chooseStrangerOrbit();
    });

    // Sample the ellipse by arc length so the comet covers equal distances
    // in equal time without leaving its orbit.
    // The orbit is sampled against the loop's story clock, so frame rate and
    // preview acceleration cannot change the collision time.
    let cometStartProgress = .958;
    let cometProgress = cometStartProgress;
    let previousFrameTime = null;
    let cometCollisionArmed = false;
    let loopStoryElapsed = 0;
    let cometTimelineActive = false;
    let cometStoryDuration = 22 * 60;
    let cometTimeline = [];
    let cometRephase = null;
    let cometSwallowed = false;
    let cometInitiallyPlaced = false;
    const orbitSamples = 720;
    const cometTimelineStep = .1;
    let cometPath;
    let cometGeometryKey = '';
    function measureCometPath() {
      // Use untransformed local coordinates: the parent scales the path and
      // the comet together, so its CSS left/top must stay in that same space.
      const centerX = interloperOrbit.offsetLeft + interloperOrbit.offsetWidth / 2;
      const centerY = interloperOrbit.offsetTop + interloperOrbit.offsetHeight / 2;
      const radiusX = interloperOrbit.offsetWidth / 2;
      const radiusY = interloperOrbit.offsetHeight / 2;
      const geometryKey = [centerX, centerY, radiusX, radiusY,
        sun.offsetLeft, sun.offsetTop, sun.offsetWidth, interloper.offsetWidth].join(':');
      if (cometPath && geometryKey === cometGeometryKey) return false;
      cometGeometryKey = geometryKey;
      const distances = new Float32Array(orbitSamples + 1);
      let previousX = centerX + radiusX;
      let previousY = centerY;
      for (let i = 1; i <= orbitSamples; i++) {
        const angle = i * Math.PI * 2 / orbitSamples;
        const x = centerX + radiusX * Math.cos(angle);
        const y = centerY + radiusY * Math.sin(angle);
        distances[i] = distances[i - 1] + Math.hypot(x - previousX, y - previousY);
        previousX = x;
        previousY = y;
      }
      cometPath = { centerX, centerY, radiusX, radiusY, distances,
        length: distances[orbitSamples] };
      return true;
    }
    measureCometPath();
    const wrapCometPhase = phase => ((phase % 1) + 1) % 1;
    function cometDistanceToSun(phase) {
      const angle = angleAtDistance(wrapCometPhase(phase) * cometPath.length);
      const x = cometPath.centerX + cometPath.radiusX * Math.cos(angle);
      const y = cometPath.centerY + cometPath.radiusY * Math.sin(angle);
      return Math.hypot(sun.offsetLeft - x, sun.offsetTop - y);
    }
    function cometSpeedBoost(phase) {
      return 1 + Math.max(0, 1 - cometDistanceToSun(phase) / (sun.offsetWidth * 1.8)) * 3;
    }
    function advanceCometPhase(phase, seconds) {
      const rate = orbitSpeed / 180;
      const midpoint = phase + seconds * rate * cometSpeedBoost(phase) / 2;
      return phase + seconds * rate * cometSpeedBoost(midpoint);
    }
    function rawCometPhaseAtStoryTime(seconds) {
      if (!cometTimeline.length) return cometStartProgress;
      const index = Math.max(0, Math.min(seconds / cometTimelineStep, cometTimeline.length - 1));
      const before = Math.floor(index);
      const after = Math.min(before + 1, cometTimeline.length - 1);
      return cometTimeline[before] +
        (cometTimeline[after] - cometTimeline[before]) * (index - before);
    }
    function cometPhaseAtStoryTime(seconds) {
      let phase = rawCometPhaseAtStoryTime(seconds);
      if (cometRephase && seconds < cometRephase.start + cometRephase.duration) {
        const progress = Math.max(0, (seconds - cometRephase.start) / cometRephase.duration);
        const eased = progress * progress * (3 - 2 * progress);
        phase += cometRephase.offset * (1 - eased);
      }
      return wrapCometPhase(phase);
    }
    function calibrateCometStart() {
      if (!cometPath || !sun.offsetWidth) return;
      const previousPhase = cometTimelineActive ? cometPhaseAtStoryTime(loopStoryElapsed) : cometProgress;
      const objectScale = Number.parseFloat(getComputedStyle(sun).getPropertyValue('--object-scale')) || 1;
      const sunRadius = sun.offsetWidth * objectScale * .47;
      const cometHead = interloper.offsetWidth * objectScale * .38;
      const redFraction = 1201 / 1320;
      const redProgress = redFraction * redFraction * (3 - 2 * redFraction);
      const contactRadius = sunRadius * (1 + .30 * redProgress) + cometHead;
      const contactSamples = 4096;
      let contactPhase = null;
      for (let i = 0; i < contactSamples; i++) {
        const phase = i / contactSamples;
        const previous = wrapCometPhase(phase - 1 / contactSamples);
        if (cometDistanceToSun(previous) > contactRadius &&
            cometDistanceToSun(phase) <= contactRadius) {
          contactPhase = phase;
          break;
        }
      }
      if (contactPhase === null) return;
      // Match the original 1:59 contact fraction at either story length.
      const contactTime = cometStoryDuration * 1201 / 1320;
      const armTime = cometStoryDuration * 1200 / 1320;
      let phase = contactPhase;
      for (let t = contactTime; t > 0; t -= cometTimelineStep) {
        const step = Math.min(cometTimelineStep, t);
        phase = advanceCometPhase(phase, -step);
      }
      cometStartProgress = wrapCometPhase(phase);
      cometTimeline = [cometStartProgress];
      phase = cometStartProgress;
      for (let t = cometTimelineStep; t <= cometStoryDuration + 30; t += cometTimelineStep) {
        phase = advanceCometPhase(phase, cometTimelineStep);
        cometTimeline.push(phase);
      }
      cometRephase = null;
      if (cometTimelineActive && loopStoryElapsed < armTime) {
        const newPhase = wrapCometPhase(rawCometPhaseAtStoryTime(loopStoryElapsed));
        const offset = ((previousPhase - newPhase + 1.5) % 1) - .5;
        const duration = Math.min(90, Math.max(0, armTime - loopStoryElapsed - 3));
        if (duration > 0 && Math.abs(offset) > .0001) {
          cometRephase = { start: loopStoryElapsed, duration, offset };
        }
      }
      cometProgress = cometPhaseAtStoryTime(loopStoryElapsed);
    }
    calibrateCometStart();
    window.addEventListener('resize', () => {
      if (measureCometPath()) calibrateCometStart();
    });
    window.addEventListener('wallpaper-loop-time', event => {
      loopStoryElapsed = Math.max(0, Number(event.detail) || 0);
      cometTimelineActive = true;
    });
    window.addEventListener('wallpaper-loop-story-duration', event => {
      const nextDuration = Number(event.detail);
      if (!Number.isFinite(nextDuration) || nextDuration <= 0 || nextDuration === cometStoryDuration) return;
      cometStoryDuration = nextDuration;
      calibrateCometStart();
    });
    function syncStrangerAnimation() {
      system.getAnimations().forEach(animation => {
        if (animation.animationName === 'stranger-orbit') {
          animation.playbackRate = orbitSpeed * strangerSpeed * previewScale;
        }
      });
    }
    syncStrangerAnimation();
    window.addEventListener('wallpaper-stranger-speed-changed', event => {
      strangerSpeed = event.detail;
      syncStrangerAnimation();
    });
    window.addEventListener('wallpaper-speed-changed', event => {
      const nextSpeed = Number(event.detail);
      if (!Number.isFinite(nextSpeed) || nextSpeed <= 0 || nextSpeed === orbitSpeed) return;
      orbitSpeed = nextSpeed;
      calibrateCometStart();
      syncStrangerAnimation();
      requestAnimationFrame(syncOrbitAnimations);
    });
    window.addEventListener('wallpaper-time-scale-changed', event => {
      previewScale = Math.max(1, Number(event.detail) || 1);
      updateQuantumShiftTimer();
      requestAnimationFrame(() => {
        syncOrbitAnimations();
        syncStrangerAnimation();
        syncLoopEffectAnimations();
      });
    });
    window.addEventListener('wallpaper-loop-comet-impact-ready', event => {
      cometCollisionArmed = Boolean(event.detail);
    });
    window.addEventListener('wallpaper-loop-reset', () => {
      cometCollisionArmed = false;
      cometSwallowed = false;
      cometTimelineActive = false;
      loopStoryElapsed = 0;
      cometRephase = null;
      interloper.classList.remove('interloper--swallowed');
      interloperOrbit.classList.remove('interloper-orbit--swallowed');
      interloperBeam.style.opacity = '';
      cometProgress = cometStartProgress;
      previousFrameTime = null;
      document.querySelectorAll('.solar-system, .traveller, .binary-system, .moon-orbit, .quantum-orbit, .sun-station-orbit, .sun__image, .planet--timber, .planet--brittle, .planet--giants, .planet--bramble')
        .forEach(element => element.getAnimations().forEach(animation => { animation.currentTime = 0; }));
      syncOrbitAnimations();
      syncStrangerAnimation();
    });

    function angleAtDistance(distance) {
      const distances = cometPath.distances;
      let low = 0;
      let high = orbitSamples;
      while (high - low > 1) {
        const middle = (low + high) >> 1;
        if (distances[middle] <= distance) low = middle;
        else high = middle;
      }
      const segment = distances[high] - distances[low];
      const fraction = segment ? (distance - distances[low]) / segment : 0;
      return (low + fraction) * Math.PI * 2 / orbitSamples;
    }

    function animateInterloper(now) {
      if (previewScale > 1) syncLoopEffectAnimations();
      const frameDelta = previousFrameTime === null ? 0 : Math.min(now - previousFrameTime, 100);
      previousFrameTime = now;

      // The Sun uses left/top 50% with translate(-50%, -50%), so its
      // offset position is already the center point in the system.
      const sunCenterX = sun.offsetLeft;
      const sunCenterY = sun.offsetTop;

      if (cometTimelineActive) {
        cometProgress = cometPhaseAtStoryTime(loopStoryElapsed);
      } else if (!reducedMotion.matches && !wallpaperPaused) {
        cometProgress = wrapCometPhase(advanceCometPhase(cometProgress, frameDelta / 1000 * previewScale));
      }

      const distance = cometProgress * cometPath.length;
      const angle = angleAtDistance(distance);
      const x = cometPath.centerX + cometPath.radiusX * Math.cos(angle);
      const y = cometPath.centerY + cometPath.radiusY * Math.sin(angle);
      // A conic gradient uses the visible polar angle, which differs from
      // the ellipse parameter when the horizontal and vertical radii differ.
      const trailAngle = Math.atan2(y - cometPath.centerY, x - cometPath.centerX);
      interloperOrbit.style.setProperty('--trail-angle', `${trailAngle * 180 / Math.PI}deg`);

      // The unrotated sprite's head points left, so turn its left-facing axis
      // toward the Sun rather than its right-facing axis.
      // Aim at the Sun's visual center. The sprite's long body shifts the
      // apparent gaze slightly right, so use a small left-side target bias.
      const targetAngle = Math.atan2(
        sunCenterY - y,
        (sunCenterX + sun.offsetWidth * .08) - x
      ) * 180 / Math.PI;
      const visualAngle = targetAngle + 180;
      interloper.style.transform = `translate3d(${x}px, ${y}px, 0) translate(-50%, -50%) rotate(${visualAngle}deg) scale(var(--object-scale, 1))`;
      interloperBeam.style.transform = `translate3d(${x}px, ${y}px, 0) translate(0, -50%) rotate(${visualAngle}deg)`;
      if (!cometInitiallyPlaced) {
        cometInitiallyPlaced = true;
        requestAnimationFrame(() => {
          interloper.classList.add('interloper--ready');
          interloperBeam.classList.add('interloper-beam--ready');
        });
      }
      // Use the same local-space contact geometry as the phase calibration.
      // Both sprites inherit the system scale, so viewport size cancels out.
      const objectScale = Number.parseFloat(getComputedStyle(sun).getPropertyValue('--object-scale')) || 1;
      const sunScale = Number.parseFloat(document.documentElement.style.getPropertyValue('--loop-sun-scale')) || 1;
      const contactRadius = sun.offsetWidth * objectScale * sunScale * .47 +
        interloper.offsetWidth * objectScale * .38;
      const cometInsideSun = cometDistanceToSun(cometProgress) <= contactRadius;
      if (cometCollisionArmed && !cometSwallowed && cometInsideSun) {
        cometSwallowed = true;
        interloper.classList.add('interloper--swallowed');
        interloperOrbit.classList.add('interloper-orbit--swallowed');
        interloperBeam.style.opacity = '0';
      }

      if (!reducedMotion.matches) requestAnimationFrame(animateInterloper);
    }
    requestAnimationFrame(animateInterloper);

    const meteoriteLayer = document.getElementById('meteorite-layer');
    const lantern = document.querySelector('.moon--hollow-lantern');
    const brittlePlanet = document.querySelector('.planet--brittle');
    let meteorLateStart = 17 * 60;
    let meteorLoopEnd = 22 * 60;
    let firstMeteorTime = 15;
    let meteorLoopEnabled = true;
    let meteorUserEnabled = true;
    let meteorStoryTime = 0;
    let meteorLatePhase = false;
    let meteorFinaleStarted = false;
    let firstMeteorPending = true;
    let nextMeteorTime = null;
    let pairedMeteorTime = null;
    let meteorGeneration = 0;
    let meteorNeedsInitialization = true;
    // One or two per burst: a 25% chance of a pair gives 1.25 meteors on
    // average. Intervals average 75s early and 25s late: ~1/min and ~3/min.
    const meteorDelay = late => late
      ? 16 + Math.random() * 18
      : 50 + Math.random() * 50;
    function resetMeteorSchedule(storyTime = 0) {
      ++meteorGeneration;
      meteoriteLayer.replaceChildren();
      meteorLatePhase = storyTime >= meteorLateStart;
      meteorFinaleStarted = false;
      firstMeteorPending = storyTime < firstMeteorTime;
      nextMeteorTime = firstMeteorPending ? firstMeteorTime : storyTime + meteorDelay(meteorLatePhase);
      pairedMeteorTime = null;
    }
    window.addEventListener('wallpaper-loop-enabled-changed', event => {
      meteorLoopEnabled = Boolean(event.detail);
      if (!meteorLoopEnabled) resetMeteorSchedule();
    });
    window.addEventListener('wallpaper-meteorites-enabled-changed', event => {
      meteorUserEnabled = Boolean(event.detail);
      resetMeteorSchedule(meteorStoryTime);
    });
    window.addEventListener('wallpaper-loop-reset', () => {
      meteorStoryTime = 0;
      meteorNeedsInitialization = true;
      resetMeteorSchedule();
    });
    window.addEventListener('wallpaper-loop-story-duration', event => {
      const nextDuration = Number(event.detail);
      if (!Number.isFinite(nextDuration) || nextDuration <= 0) return;
      meteorLoopEnd = nextDuration;
      meteorLateStart = nextDuration * 17 / 22;
      firstMeteorTime = nextDuration > 22 * 60 ? 45 : 15;
      meteorNeedsInitialization = true;
      resetMeteorSchedule(meteorStoryTime);
    });
    window.addEventListener('wallpaper-loop-time', event => {
      const storyTime = Number(event.detail);
      if (!Number.isFinite(storyTime)) return;
      meteorStoryTime = storyTime;
      if (meteorNeedsInitialization) {
        meteorNeedsInitialization = false;
        resetMeteorSchedule(storyTime);
      }
      if (!meteorLoopEnabled || !meteorUserEnabled || wallpaperPaused) return;
      if (storyTime >= meteorLoopEnd) {
        if (!meteorFinaleStarted) {
          meteorFinaleStarted = true;
          ++meteorGeneration;
          meteoriteLayer.replaceChildren();
        }
        return;
      }
      if (storyTime >= meteorLateStart && !meteorLatePhase) {
        meteorLatePhase = true;
        nextMeteorTime = storyTime + meteorDelay(true);
      }
      if (pairedMeteorTime !== null && storyTime >= pairedMeteorTime) {
        pairedMeteorTime = null;
        spawnMeteorite();
      }
      if (storyTime >= nextMeteorTime) {
        spawnMeteorite();
        if (!firstMeteorPending && Math.random() < .25) {
          pairedMeteorTime = storyTime + 2 + Math.random() * 2;
        }
        firstMeteorPending = false;
        nextMeteorTime = storyTime + meteorDelay(meteorLatePhase);
      }
    });
    resetMeteorSchedule();
    function spawnMeteorite() {
      if (wallpaperPaused || reducedMotion.matches ||
          meteoriteLayer.querySelectorAll('.meteorite').length >= 2) return;
      const systemBounds = system.getBoundingClientRect();
      const scale = systemBounds.width / system.offsetWidth;
      if (!Number.isFinite(scale) || scale <= 0) return;
      const source = lantern.getBoundingClientRect();
      const target = brittlePlanet.getBoundingClientRect();
      const targetX = (target.left + target.width / 2 - systemBounds.left) / scale;
      const targetY = (target.top + target.height / 2 - systemBounds.top) / scale;
      const sourceX = (source.left + source.width / 2 - systemBounds.left) / scale;
      const sourceY = (source.top + source.height / 2 - systemBounds.top) / scale;
      const directionX = targetX - sourceX;
      const directionY = targetY - sourceY;
      const distance = Math.hypot(directionX, directionY) || 1;
      const unitX = directionX / distance;
      const unitY = directionY / distance;
      // Scatter impacts across the visible inner face, rather than always
      // ending at the same point on the rim nearest Hollow's Lantern.
      // The planet image spins, so its viewport bounding box can be larger
      // than the circular sprite. Its unrotated width gives the true diameter.
      const objectScale = Number.parseFloat(getComputedStyle(brittlePlanet).getPropertyValue('--object-scale')) || 1;
      const planetDiameter = brittlePlanet.offsetWidth * objectScale;
      const impactDepth = planetDiameter * (.04 + Math.random() * .22);
      const impactSide = planetDiameter * (Math.random() - .5) * .36;
      const endX = targetX - unitX * impactDepth - unitY * impactSide;
      const endY = targetY - unitY * impactDepth + unitX * impactSide;
      // Emerge from Hollow's Lantern itself, using its position at launch.
      const startX = sourceX;
      const startY = sourceY;
      const arc = (Math.random() < .5 ? -1 : 1) * (6 + Math.random() * 7);
      const meteor = document.createElement('span');
      meteor.className = 'meteorite';
      meteoriteLayer.appendChild(meteor);
      const generation = meteorGeneration;
      const duration = Math.max(950,
        (1.4 + Math.random() * .6) * 1000 / Math.max(1, orbitSpeed * previewScale));
      const started = performance.now();
      function targetShift() {
        const bounds = system.getBoundingClientRect();
        const currentScale = bounds.width / system.offsetWidth;
        const planet = brittlePlanet.getBoundingClientRect();
        return {
          x: (planet.left + planet.width / 2 - bounds.left) / currentScale - targetX,
          y: (planet.top + planet.height / 2 - bounds.top) / currentScale - targetY
        };
      }
      function showImpact() {
        const impact = document.createElement('span');
        impact.className = 'meteor-impact';
        meteoriteLayer.appendChild(impact);
        const impactStarted = performance.now();
        function animateImpact(now) {
          if (generation !== meteorGeneration) { impact.remove(); return; }
          const progress = Math.min(1, (now - impactStarted) / 380);
          const shift = targetShift();
          impact.style.transform = `translate3d(${endX + shift.x}px, ${endY + shift.y}px, 0) translate(-50%, -50%) scale(${.7 + progress * 1.4})`;
          impact.style.opacity = String(Math.pow(1 - progress, 1.5));
          if (progress < 1) requestAnimationFrame(animateImpact);
          else impact.remove();
        }
        animateImpact(impactStarted);
      }
      function move(now) {
        if (generation !== meteorGeneration) { meteor.remove(); return; }
        const progress = Math.min(1, (now - started) / duration);
        const eased = Math.pow(progress, 1.25);
        const curve = arc * Math.pow(Math.sin(progress * Math.PI), 2);
        // Carry the launch path with the moving planet, so its end remains on
        // the current surface even when the orbit is running at preview speed.
        const shift = targetShift();
        const x = startX + (endX - startX) * eased - unitY * curve + shift.x;
        const y = startY + (endY - startY) * eased + unitX * curve + shift.y;
        const travelSpeed = 1.25 * Math.pow(Math.max(progress, .01), .25);
        const curveSpeed = arc * Math.PI * Math.sin(2 * Math.PI * progress);
        const angle = Math.atan2(
          (endY - startY) * travelSpeed + unitX * curveSpeed,
          (endX - startX) * travelSpeed - unitY * curveSpeed
        ) * 180 / Math.PI;
        meteor.style.transform = `translate3d(${x}px, ${y}px, 0) translate(-50%, -50%) rotate(${angle}deg)`;
        meteor.style.opacity = String(Math.min(1, progress * 8));
        if (progress < 1) requestAnimationFrame(move);
        else {
          meteor.remove();
          showImpact();
        }
      }
      move(started);
    }
  </script>
